<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numa Stays - Accrued</title>
<style>
:root { --bg:#0b0f14; --card:#151b23; --line:#232c38; --txt:#e6edf3; --muted:#8b98a5; --blue:#00bfff; --green:#33d755; --yellow:#ffc107; --orange:#ff6b35; --red:#ff5c5c; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
header { display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.brand { font-size:18px; font-weight:700; }
.company { background:#1d2733; border:1px solid var(--line); border-radius:8px; padding:7px 32px 7px 13px; font-weight:600; font-size:14px; min-width:200px; max-width:340px; color:var(--txt); cursor:pointer; appearance:none; -webkit-appearance:none; }
.company:hover { border-color:#3a4a5e; }
.company:focus { outline:none; border-color:var(--blue); }
#dashboard { background-color:#12202b; border-color:#1c3242; color:var(--blue); }
.spacer { flex:1; }
.pill { padding:6px 12px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--muted); }
.pill.ok { color:var(--green); border-color:#1f4d2e; background:#10261a; }
.pill.bad { color:var(--yellow); border-color:#4d431f; background:#261f10; }
.btn { background:var(--blue); color:#04121b; border:none; padding:9px 14px; border-radius:8px; font-weight:700; cursor:pointer; text-decoration:none; font-size:13px; display:inline-block; }
.btn.sec { background:transparent; color:var(--txt); border:1px solid var(--line); }
.tabs { display:flex; gap:8px; align-items:center; padding:12px 24px 0; overflow-x:auto; white-space:nowrap; scrollbar-width:thin; }
.tabs::-webkit-scrollbar { height:8px; }
.tabs::-webkit-scrollbar-thumb { background:#243040; border-radius:4px; }
.tab { background:#141c26; border:1px solid var(--line); color:var(--muted); padding:7px 13px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; flex:0 0 auto; }
.tab:hover { border-color:#3a4a5e; color:var(--txt); }
.tab.on { background:var(--blue); border-color:var(--blue); color:#04121b; }
.tabsep { color:#4c5866; font-size:10px; letter-spacing:.12em; padding:0 2px; flex:0 0 auto; }
h1 { font-size:22px; margin:20px 24px 4px; }
.sub { color:var(--muted); font-size:13px; margin:0 24px 18px; }
.controls { display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; padding:0 24px 18px; }
.ctl { display:flex; flex-direction:column; gap:6px; }
.ctl.grow { flex:1; min-width:220px; }
.ctl label { font-size:11px; letter-spacing:.06em; color:var(--muted); }
input, .controls select { background:#101720; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:13px; width:100%; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; padding:0 24px 20px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
.kpi .t { font-size:11px; letter-spacing:.08em; color:var(--muted); }
.kpi .v { font-size:22px; font-weight:700; margin-top:8px; }
.kpi .s { font-size:12px; color:var(--muted); margin-top:6px; }
.wrap { margin:0 24px 16px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:9px 14px; text-align:left; white-space:nowrap; }
th.num, td.num { text-align:right; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
td.link { color:var(--blue); }
td.desc { max-width:340px; overflow:hidden; text-overflow:ellipsis; }
td.acct { max-width:240px; overflow:hidden; text-overflow:ellipsis; }
table.inner td.desc { max-width:420px; }
td.caret { color:var(--muted); width:22px; }
thead th { background:#111823; color:var(--muted); font-size:11px; letter-spacing:.06em; position:sticky; top:0; }
tbody tr.row { border-top:1px solid var(--line); cursor:pointer; }
tbody tr.row:hover { background:#19212c; }
tfoot td { border-top:2px solid var(--line); font-weight:700; background:#111823; }
tr.detail td { background:#0e141c; padding:0 14px 14px; white-space:normal; }
.dhead { color:var(--muted); font-size:12px; padding:10px 0 4px; }
.dstate { color:var(--muted); font-size:12px; padding:12px 0; }
table.inner { margin-top:4px; font-size:12px; background:#0b1118; border:1px solid var(--line); border-radius:8px; }
table.inner thead th { background:#101823; position:static; }
table.inner tfoot td { background:#101823; }
.state { padding:40px; text-align:center; color:var(--muted); } body { font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; } h1 { font-size:24px; } .sub { font-size:13.5px; } .ctl label { font-size:11.5px; text-transform:uppercase; } .kpi .v { font-size:24px; } .note { font-size:13px; line-height:1.6; } table { font-size:13.5px; } th, td { padding:9px 12px; vertical-align:middle; } th.num, td.num { font-variant-numeric:tabular-nums; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; } thead th { background:#0f1620; color:#a9b7c6; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; z-index:3; border-bottom:1px solid var(--line); } thead th.sortable { cursor:pointer; user-select:none; } thead th.sortable:hover { color:var(--blue); } thead th.ns-asc:after { content:' \25b2'; color:var(--blue); } thead th.ns-dsc:after { content:' \25bc'; color:var(--blue); } td.desc { max-width:400px; } td.acct { max-width:170px; color:var(--muted); } table.inner td.desc { white-space:normal; max-width:520px; } td.per { color:var(--muted); } td.link { text-decoration:underline; text-decoration-color:#2a3b4d; text-underline-offset:3px; } tbody tr.row.alt { background:#1a222e; } tbody tr.row.alt:hover { background:#22303f; } tbody tr.row.grp > td { border-top:1px solid #2f3d4d; } tbody tr.row td:last-child { color:#8fd0ff; } tfoot td { position:sticky; bottom:0; z-index:2; } .wrap { max-height:calc(100vh - 340px); min-height:280px; } .sumbox { display:flex; gap:10px; flex-wrap:wrap; padding:0 24px 16px; } .sumcard { background:#111823; border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-size:13px; display:flex; gap:14px; align-items:baseline; } .sumcard b { color:var(--blue); font-size:14px; } .sumcard .sml { color:var(--muted); } .sumcard .snet { font-weight:700; }
.note { color:var(--muted); font-size:12px; padding:0 24px 40px; } .vtabs { display:flex; gap:8px; padding:0 24px 16px; } .vtab { background:#141c26; border:1px solid var(--line); color:var(--muted); padding:8px 18px; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; } .vtab:hover { border-color:#3a4a5e; color:var(--txt); } .vtab.on { background:var(--blue); border-color:var(--blue); color:#04121b; } table.pivot { font-size:13px; } table.pivot th, table.pivot td { padding:8px 12px; } table.pivot th.c1, table.pivot td.c1 { position:sticky; left:0; z-index:2; background:var(--card); min-width:330px; max-width:420px; overflow:hidden; text-overflow:ellipsis; border-right:1px solid var(--line); } table.pivot thead th.c1 { background:#0f1620; z-index:4; } table.pivot tbody tr.pcc { cursor:pointer; font-weight:700; border-top:1px solid var(--line); } table.pivot tbody tr.pcc:hover td { background:#1c2836; } table.pivot tbody tr.pac td { background:#111a24; font-size:12.5px; } table.pivot tbody tr.pac td.c1 { padding-left:34px; color:#cfe0ee; font-weight:400; } table.pivot td.gt, table.pivot th.gt { position:sticky; right:0; z-index:2; background:#131e29; font-weight:700; border-left:1px solid var(--line); } table.pivot thead th.gt { background:#0f1620; z-index:4; } table.pivot tfoot td.gt { background:#0f1620; z-index:3; } table.pivot tbody tr.pac td.gt { background:#131e29; } table.pivot .neg { color:#ff8a8a; } table.pivot .pos { color:#8fd0ff; } table.pivot .z { color:#3d4a58; } table.pivot tfoot td { background:#0f1620; } table.pivot tfoot td.c1 { position:sticky; left:0; background:#0f1620; z-index:3; } table.pivot tbody tr td:last-child { color:inherit; } table.pivot .sml { color:var(--muted); font-weight:400; font-size:11.5px; } table.pivot .ys { border-left:1px solid #33445a; }
</style>
</head>
<body>
<div class="state">Loading Accrued dashboard</div>
<script src="/accrued.js?v=1"></script>
</body>
</html>
